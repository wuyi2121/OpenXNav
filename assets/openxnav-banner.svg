<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">OpenXNav — Towards Generalist Embodied Navigation</title>
  <desc id="desc">A dark blue banner with a cyan navigation route connecting points on an abstract city map.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1426"/>
      <stop offset="1" stop-color="#132C43"/>
    </linearGradient>
    <linearGradient id="route" x1="814" y1="268" x2="1158" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58DCC7"/>
      <stop offset="1" stop-color="#78BFFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#8EAAC3" stroke-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#background)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <g stroke="#55718A" stroke-opacity="0.22" stroke-width="2">
    <rect x="808" y="56" width="90" height="92" rx="12"/>
    <rect x="930" y="56" width="96" height="92" rx="12"/>
    <rect x="1058" y="56" width="146" height="92" rx="12"/>
    <rect x="808" y="180" width="90" height="124" rx="12"/>
    <rect x="930" y="180" width="96" height="124" rx="12"/>
    <rect x="1058" y="180" width="146" height="124" rx="12"/>
  </g>
  <path d="M840 268H914V164H1042V80H1158" stroke="#5ADBC8" stroke-opacity="0.08" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M840 268H914V164H1042V80H1158" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="840" cy="268" r="12" fill="#122C3D" stroke="#58DCC7" stroke-width="3"/>
  <circle cx="840" cy="268" r="4" fill="#58DCC7"/>
  <circle cx="1042" cy="164" r="6" fill="#73C5EF"/>
  <circle cx="1158" cy="80" r="21" fill="#78BFFF" fill-opacity="0.12"/>
  <path d="m1158 65 10 27-10-6-10 6 10-27Z" fill="#9FD3FF"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="68" y="82" fill="#67DCCB" font-size="14" font-weight="600" letter-spacing="3">UNDERSTAND · NAVIGATE · ACT</text>
    <text x="64" y="183" fill="#F2F7FC" font-size="82" font-weight="750" letter-spacing="-3">Open<tspan fill="#67DCCB">X</tspan>Nav</text>
    <text x="68" y="231" fill="#BCCDDC" font-size="25">Towards Generalist Embodied Navigation</text>
    <line x1="68" y1="269" x2="108" y2="269" stroke="#67DCCB" stroke-width="3"/>
    <text x="124" y="275" fill="#8FA8BE" font-size="16" letter-spacing="0.5">One System, Many Navigation Tasks.</text>
  </g>
</svg>
